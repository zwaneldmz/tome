[package]
name = "tome"
version = "0.3.0"
description = "A coding harness: agents, terminals, editors, and chat in one bound workspace."
authors = ["Lwando Zwane"]
edition = "2021"

# See https://v2.tauri.app/start/create-project/#manual-setup
[lib]
name = "tome_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "tome"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Core Tauri runtime + the plugins every Phase 1-4 slice needs. Every dep any
# phase-1 slice will need is pre-added here so no later slice has to touch
# this file (see lock_gate::CHANNEL_OF_COMMAND for the full command surface
# these deps eventually back: pty via tokio, fs watching via notify, JSON
# store/events via serde_json, etc).
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
# 0.6 was the version named in the original slice brief; 0.7.0 is latest on
# crates.io as of this writing and is the version notify-debouncer-mini
# itself requires notify ^8.2.0 for (matches the `notify = "8"` pin above),
# so 0.7 is what "latest compatible" resolves to here.
notify-debouncer-mini = "0.7"
# PTY spawning for pty.rs (Phase 2 slice P1) — wezterm's cross-platform pty
# crate; see pty.rs's module doc comment for why portable-pty rather than
# node-pty's semantics (explicit kill/reap, no auto-SIGHUP-on-drop).
portable-pty = "0.9"
scrypt = "0.12.0"
subtle = "2.6.1"
base32 = "0.5.1"
keyring = "4.1.6"
hmac = "0.13.0"
sha1 = "0.11.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "json", "stream", "charset"] }
regex = "1.13.1"
# chat/sse.rs: CancellationToken backing chat_abort (ipc/chat.rs's INFLIGHT
# registry) and StreamExt::next() for reading reqwest's bytes_stream() —
# both already resolved transitively (reqwest/tauri pull them in); declared
# directly here since chat/sse.rs `use`s them itself. Versions match what
# Cargo.lock already had resolved, so adding these direct entries does not
# bump anything.
tokio-util = "0.7"
futures-util = "0.3"
# Plan step 2.1: the extracted background flow-run engine (DAG scheduling,
# the live run registry, realpath confinement, product promotion, agent
# spawn-policy allowlists, the air-gap subsystem) — see that crate's own
# `lib.rs` doc comment for its full membership. `tome_lib` re-exports its
# public surface at every module's original path (`flow`, `agent_spawn`,
# `agent_env`, `login_env`, `airgap`, `custom_agents`), so this is the one
# place those modules' code is now actually compiled from.
tome-flow = { path = "crates/tome-flow" }

[dev-dependencies]
tempfile = "3"

[workspace]
members = ["crates/tome-shim", "crates/tome-flow", "crates/tome-runner"]

# The conductor/flow `*Env` structs are dependency-injection seams whose
# fields are `Arc<dyn Fn(...) + Send + Sync>` callbacks — each signature is a
# one-off and already documented at the field site, so the `type_complexity`
# style lint (which wants a `type` alias per field) obscures more than it
# clarifies here. Reviewed and allowed deliberately.
[lints.clippy]
type_complexity = "allow"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-local-authentication = "0.3.2"
