<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' tome:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' tome: data:; connect-src 'self' ws: wss:; frame-src 'self' tome: data:; object-src 'none'; base-uri 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tome</title>
  </head>
  <body>
    <header id="topbar">
      <div class="traffic-pad"></div>
      <div class="chip-wrap">
        <button id="ws-chip" title="Workspace — switch, create, or add folders" aria-label="Workspace" aria-haspopup="true">
          <span class="sigil">▚</span><span id="ws-name">no workspace</span><span class="caret">▾</span>
        </button>
        <div id="ws-menu" class="menu hidden" role="menu"></div>
      </div>
      <div class="chip-wrap">
        <button id="git-chip" class="hidden" title="Git branch" aria-label="Git branch" aria-haspopup="true">
          <span class="gly"></span><span id="git-branch"></span>
        </button>
        <div id="git-menu" class="menu hidden" role="menu"></div>
      </div>
      <div id="git-stats" title="Working tree changes"></div>
      <div class="spacer"></div>
      <button
        id="btn-voice"
        class="icon-btn"
        title="Voice chat (⌘⇧V)"
        aria-label="Voice chat"
        aria-pressed="false"
        aria-haspopup="true"
      ></button>
      <button id="btn-theme" class="icon-btn" title="Appearance" aria-label="Appearance"></button>
      <div class="chip-wrap">
        <button id="btn-notifs" class="icon-btn" title="Notifications — recent activity &amp; blocked requests" aria-label="Notifications" aria-haspopup="true"></button>
        <div id="notifs-menu" class="menu hidden" role="menu"></div>
      </div>
      <div class="chip-wrap">
        <button id="btn-add" class="icon-btn" title="New pane — agents, terminal, editor, chat" aria-label="New pane" aria-haspopup="true">
          <span class="plus"></span>
        </button>
        <div id="add-menu" class="menu hidden" role="menu"></div>
      </div>
    </header>
    <div id="body">
      <aside id="tree">
        <div id="tree-head">
          <button id="btn-sidebar" class="icon-btn" title="Hide sidebar (⌘B)" aria-label="Toggle sidebar">
            <span class="chev"></span>
          </button>
          <button id="btn-new-file" class="icon-btn" title="New file" aria-label="New file"></button>
          <button id="btn-new-folder" class="icon-btn" title="New folder" aria-label="New folder"></button>
        </div>
        <div id="tree-body"></div>
      </aside>
      <div id="tree-divider" title="Drag to resize the sidebar"></div>
      <main id="dock"></main>
    </div>
    <footer id="statusbar" aria-label="Status">
      <span id="sb-root" class="sb-item" title="Active root — new panes and git follow this folder"></span>
      <span id="sb-context" class="sb-item sb-context" title="Active pane"></span>
      <span class="sb-spacer"></span>
      <span id="sb-panes" class="sb-item" title="Open panes"></span>
      <button id="sb-runs" class="sb-item sb-runs" type="button" title="Flow runs" aria-label="Flow runs"></button>
      <span id="sb-airgap" class="sb-item sb-net" title="Air-gap network state"></span>
    </footer>
    <div id="toasts"></div>
    <div id="sr-live" class="visually-hidden" aria-live="polite" role="status"></div>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
