<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' tome:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' tome: data:; connect-src 'self' ws: wss:; frame-src 'self' tome: data:; object-src 'none'; base-uri 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tome</title>
  </head>
  <body>
    <header id="topbar">
      <div class="traffic-pad"></div>
      <button id="btn-sidebar" class="icon-btn" title="Hide sidebar (⌘B)" aria-label="Toggle sidebar">
        <span class="chev">⇤</span>
      </button>
      <div class="chip-wrap">
        <button id="ws-chip" title="Workspace" aria-label="Workspace" aria-haspopup="true">
          <span class="sigil">▚</span><span id="ws-name">no workspace</span><span class="caret">▾</span>
        </button>
        <div id="ws-menu" class="menu hidden" role="menu"></div>
      </div>
      <div class="chip-wrap">
        <button id="git-chip" class="hidden" title="Git branch" aria-label="Git branch" aria-haspopup="true">
          <span class="gly">⎇</span><span id="git-branch"></span>
        </button>
        <div id="git-menu" class="menu hidden" role="menu"></div>
      </div>
      <div id="git-stats" title="Working tree changes"></div>
      <div class="spacer"></div>
      <button id="btn-theme" class="icon-btn" title="Appearance" aria-label="Appearance">◐</button>
      <div class="chip-wrap">
        <button id="btn-notifs" class="icon-btn" title="Notifications" aria-label="Notifications" aria-haspopup="true">
          ♪
        </button>
        <div id="notifs-menu" class="menu hidden" role="menu"></div>
      </div>
      <div class="chip-wrap">
        <button id="btn-add" class="icon-btn" title="New pane" aria-label="New pane" aria-haspopup="true">
          <span class="plus">＋</span>
        </button>
        <div id="add-menu" class="menu hidden" role="menu"></div>
      </div>
    </header>
    <div id="body">
      <aside id="tree"></aside>
      <main id="dock"></main>
    </div>
    <div id="toasts"></div>
    <div id="sr-live" class="visually-hidden" aria-live="polite" role="status"></div>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
