name: linux-sandbox

# Phase 4/slice L3 of the Electron -> Rust+Tauri rewrite: the Linux air-gap
# enforcement (bubblewrap + tome-shim) is written and unit-tested on macOS
# (this repo's own dev host, which has no network namespaces to exercise
# it for real) but only ever PROVEN on a real Linux box. This job is that
# proof — see src-tauri/src/linux_sandbox_integration_tests.rs's own doc
# comment for exactly what each test in the curl matrix checks and this
# job's own honest scope limits (bwrap/rung-1 only; rung 2's self-unshare
# fallback has no integration coverage here yet).
#
# Three things happen here that no other job in this repo can do yet:
# 1. The FIRST real `cargo build`/`cargo test` of the whole src-tauri
#    workspace for a genuine Linux target (every other Rust gate in this
#    repo's own local dev loop runs on macOS; only src-tauri/crates/
#    tome-shim gets a `--target x86_64-unknown-linux-gnu` CROSS-check
#    there, and that check never touches the main `tome` package at all).
# 2. Staging the tome-shim sidecar the same way `tauri build` would
#    (scripts/build-sidecar.sh), proving that script on a clean checkout.
# 3. Actually running the `#[ignore]`d curl-matrix integration tests —
#    real bwrap, real netns, real curl.

permissions:
  contents: read

# Cancel a superseded run (a newer push to the same PR/branch) instead of
# burning minutes on a stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, rewrite/tauri]
  pull_request:

jobs:
  linux-sandbox:
    # Matrix over both supported Ubuntu LTS lines: 22.04 is the "common
    # case" (unprivileged user namespaces allowed by default) and 24.04
    # exercises the AppArmor userns restriction the
    # "Allow unprivileged user namespaces" step below relaxes. Follow-ups
    # not yet covered: Fedora (needs a container job, not a hosted VM image)
    # and Linux aarch64 (needs an arm64 runner or a cross toolchain).
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # bubblewrap: the actual mechanism under test. The rest of this list
      # is Tauri v2's own documented Ubuntu build prerequisites (needed to
      # compile the real `tome` binary — webkitgtk/gtk bindings and
      # friends) plus `procps` for `pgrep`, which
      # linux_sandbox_integration_tests.rs's orphan-process check shells
      # out to directly.
      - name: Install bubblewrap + Tauri Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bubblewrap \
            procps \
            curl \
            wget \
            file \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Allow unprivileged user namespaces on this runner
        # Ubuntu 24.04 (ubuntu-latest) ships AppArmor's userns restriction
        # (kernel.apparmor_restrict_unprivileged_userns=1) by default: an
        # unconfined process may not create a user namespace, which bwrap
        # --unshare-user needs. That makes the stock runner the WRONG
        # environment for this proof as-is — not because bwrap is broken
        # there, but because the restriction is exactly what a hardened
        # production desktop could also have on, and this job exists to
        # prove the sandbox works for the common case. The common case is
        # still "userns allowed" (Ubuntu 22.04/23.x, Debian, Fedora,
        # Arch, and any 24.04 machine that installed a bwrap AppArmor
        # profile or relaxed the knob), so the job relaxes the knob for
        # its own run and says so loudly — the alternative (shipping a
        # setuid bwrap or an AppArmor profile) is a packaging decision
        # this repo has not made yet. Self-unshare rung-2 (tome-shim
        # --self-unshare) needs the same userns, so this one sysctl
        # covers both rungs.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sysctl kernel.apparmor_restrict_unprivileged_userns

      - name: Confirm bubblewrap actually works on this runner
        # THE DESIGN's own risk callout: bwrap needs either a setuid-root
        # helper or working unprivileged user namespaces, and some
        # container-based CI runners restrict both. Fail loudly and early,
        # with a clear diagnostic, rather than deep inside a confusing
        # integration-test failure.
        run: |
          bwrap --version
          bwrap --unshare-user --unshare-net --dev-bind / / -- /bin/echo "bwrap smoke test OK"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # The cache key must distinguish ubuntu-22.04 from ubuntu-24.04:
          # tauri's rlibs are compiled against each image's own glibc/webkit,
          # and the default "Linux-x64" key let the 24.04 leg's artifacts get
          # restored into the 22.04 leg — cargo saw "fresh" fingerprints but
          # unusable rlibs and failed with "can't find crate for `tauri`".
          # Bump the prefix to bust the poisoned v0 cache and key it on the
          # matrix OS, so a 22.04 run can never restore 24.04-built tauri
          # rlibs (or vice versa).
          prefix-key: v1-rust-${{ matrix.os }}

      # MUST come before any plain `cargo build`/`cargo test` of the main
      # package: tauri.conf.json's bundle.externalBin makes tauri-build's
      # build script REQUIRE the triple-suffixed sidecar path to exist at
      # compile time ("resource path `binaries/tome-shim-<triple>` doesn't
      # exist" fails the build script, before any Rust compiles) — the
      # first run of this job learned that the hard way. This is the same
      # step `tauri build`'s beforeBuildCommand runs, just earlier.
      - name: Stage the tome-shim sidecar (scripts/build-sidecar.sh — required by tauri-build's externalBin check)
        run: bash scripts/build-sidecar.sh

      - name: cargo build --workspace (the real Linux compile no other job performs)
        working-directory: src-tauri
        run: cargo build --workspace --all-targets --locked

      - name: cargo test --workspace (non-ignored — the same ~500 unit tests this repo's macOS gates already run, now proven on real Linux too)
        working-directory: src-tauri
        run: cargo test --workspace --locked

      - name: Curl matrix — real gapped-pane enforcement (#[ignore]'d integration tests)
        working-directory: src-tauri
        env:
          TOME_SHIM_BIN: ${{ github.workspace }}/src-tauri/target/release/tome-shim
        run: cargo test --workspace --locked -- --ignored --test-threads=1

  # F3: Fedora proof — that the crate compiles and its unit tests pass on the
  # other major Linux family (not just the Ubuntu LTS lines). Blocking (unlike
  # the old best-effort version) because it now only compiles + unit-tests:
  # the bwrap curl matrix is DROPPED here — bwrap cannot create a user
  # namespace inside a docker container on the shared runner (see
  # linux_sandbox_integration_tests.rs's own userns skip), and the ubuntu legs
  # above already exercise the full matrix for real. Uses Fedora's own
  # rust/cargo from dnf (dtolnay targets the host, not the container).
  fedora-sandbox:
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install bubblewrap + Tauri Linux build prerequisites + Rust (dnf)
        run: |
          dnf -y install \
            bubblewrap procps-ng curl wget file git \
            gcc gcc-c++ rust cargo \
            webkit2gtk4.1-devel openssl-devel \
            libayatana-appindicator3-devel librsvg2-devel

      - name: Stage the tome-shim sidecar (required by tauri-build's externalBin check)
        run: bash scripts/build-sidecar.sh

      - name: cargo build --workspace
        working-directory: src-tauri
        run: cargo build --workspace --all-targets --locked

      - name: cargo test --workspace (unit)
        working-directory: src-tauri
        run: cargo test --workspace --locked
