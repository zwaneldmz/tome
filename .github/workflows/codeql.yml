# Reproducible CodeQL analysis (replaces GitHub's default setup so the
# config lives in-repo and can carry paths-ignore + a Rust build).
# Languages mirror what default setup analyzed: the webview (JS/TS), the
# workflow definitions (actions), and the Rust backend.

name: codeql

permissions:
  contents: read
  security-events: write

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 2 * * 1' # weekly, off-peak

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust, actions]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      # Rust needs a real compile for CodeQL's build tracing, and tauri-build
      # requires the sidecar staged first (same prerequisites the
      # linux-sandbox job installs). JS/TS and actions need no build.
      - name: Rust build (sidecar + compile)
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          bash scripts/build-sidecar.sh
          cd src-tauri && cargo build --workspace --all-targets --locked

      - uses: github/codeql-action/autobuild@v3
        if: matrix.language != 'rust'

      - uses: github/codeql-action/analyze@v3
