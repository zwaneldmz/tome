name: build

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # npm audit's own exit code has no concept of a reviewed exception, so
      # scripts/audit-gate.mjs (not npm audit) is the pass/fail authority for
      # both steps below — see reviews/validation/audit-exceptions.json and
      # reviews/validation/TOME-017-acceptance.md.
      - name: Dependency audit gate — production (high+)
        run: npm audit --omit=dev --audit-level=high --json | node scripts/audit-gate.mjs high
      - name: Dependency audit gate — all dependencies (critical)
        run: npm audit --audit-level=critical --json | node scripts/audit-gate.mjs critical
      - name: Lint (hygiene gate)
        run: npm run lint
      - name: Tests (vitest floor — crypto, guards, confinement)
        run: npm test
      - name: Build (gates on a broken renderer import)
        run: npm run build
      # Renderer smoke check: the bundle built and every module import
      # resolved into it — a broken import fails at build, not at runtime.
      # Vite emits to dist-web/ (tauri.conf.json's frontendDist), not the
      # old electron-vite out/renderer tree.
      - name: Renderer smoke check
        run: |
          test -f dist-web/index.html
          for f in dist-web/assets/*.js; do
            node --check "$f" || { echo "renderer bundle failed parse: $f"; exit 1; }
          done
          # 'chat-mic' is a stable string from the chat panel's template —
          # class names like ChatPanel don't survive minification.
          grep -q 'chat-mic' dist-web/assets/*.js \
            && echo "renderer smoke check OK"

      # --- Rust (macOS) gate -------------------------------------------------
      # This job has always gated the renderer (npm test + vite build) but
      # never compiled a line of Rust — the src-tauri workspace only gets a
      # real `cargo` compile in the Linux sandbox job. Close that gap on the
      # macOS host this repo actually targets: install a stable toolchain
      # (no rust-toolchain(.toml) file is pinned in this repo) and compile +
      # unit-test the workspace. `cargo test --lib` stays scoped to the lib
      # unit tests — the #[ignore]'d Linux integration tests have no macOS
      # meaning and stay unrun here (see linux-sandbox.yml for those).
      - name: Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      # tauri.conf.json's bundle.externalBin makes tauri-build's build script
      # REQUIRE the triple-suffixed sidecar to exist before any Rust compiles
      # ("resource path `binaries/tome-shim-<triple>` doesn't exist"), and
      # src-tauri/binaries/ is gitignored staging output — so a clean CI
      # checkout must stage it first, exactly as the linux-sandbox job does.
      - name: Stage the tome-shim sidecar (required by tauri-build's externalBin check)
        run: bash scripts/build-sidecar.sh

      - name: cargo check (src-tauri workspace compiles)
        working-directory: src-tauri
        run: cargo check --workspace

      - name: cargo test --lib (macOS unit tests)
        working-directory: src-tauri
        run: cargo test --lib
